name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  call-review:
    uses: sathvik-dvdg/ai-code-review-workflows/.github/workflows/gemini-review.yml@main
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit